name: wonder-fitness

services:
  db:
    image: postgres:16-alpine
    container_name: wonder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wonder
      POSTGRES_PASSWORD: wonder_secret
      POSTGRES_DB: wonder_fitness
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - wonder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wonder -d wonder_fitness"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wonder-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://wonder:wonder_secret@db:5432/wonder_fitness?schema=public"
      AUTH_SECRET: "wonder-fitness-demo-secret-change-me-32chars"
      NEXT_PUBLIC_APP_URL: "http://localhost:8080"
      SEED_DB: "true"
      TZ: Asia/Ho_Chi_Minh
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-Wonder Fitness <noreply@wonder.vn>}"
      LAN_IP: "${LAN_IP:-}"
    ports:
      - "8080:3000"

  # HTTPS tự ký cho LAN — cần thiết để trình duyệt điện thoại cho phép mở
  # camera quét QR (getUserMedia chỉ chạy trong secure context).
  https:
    build:
      context: ./docker/https
    container_name: wonder-https
    restart: unless-stopped
    depends_on:
      - web
    environment:
      LAN_IP: "${LAN_IP:-}"
    ports:
      - "3443:3443"
    volumes:
      - wonder_certs:/etc/nginx/certs

volumes:
  wonder_pgdata:
  wonder_certs:
